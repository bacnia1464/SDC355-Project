<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bachir's Portfolio</title>
    <style>
        /* Base Styling */
        body {
            font-family: Arial, sans-serif;
            transition: background-color 0.3s, color 0.3s;
            padding: 20px;
        }
        
        .feature-box {
            border: 2px solid #0056b3;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            background-color: #f8f9fa;
        }

        body.dark-mode {
            background-color: #121212;
            color: #ffffff;
        }
        
        body.dark-mode .feature-box {
            background-color: #1e1e1e;
            border-color: #66b2ff;
        }
        
        body.dark-mode a {
            color: #66b2ff;
        }

        .notification {
            background-color: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none; 
            text-align: center;
            font-weight: bold;
        }
        
        body.dark-mode .notification {
            background-color: #1a4d2e;
            color: #a3cfbb;
        }

        #formStatus { margin-top: 15px; font-weight: bold; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }

        .modal-content {
            background-color: white; padding: 30px; border-radius: 8px;
            text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.2); color: #000;
        }

        body.dark-mode .modal-content {
            background-color: #1e1e1e; color: #fff; border: 1px solid #444;
        }

        #closeModalBtn {
            margin-top: 15px; padding: 8px 16px; cursor: pointer;
            background-color: #0056b3; color: white; border: none; border-radius: 4px;
        }
        
        /* Project card styling */
        .project-card img {
            display: block; margin-top: 10px; max-width: 100%; height: auto;
        }
    </style>
</head>
<body>

    <div id="welcomeModal" class="modal-overlay">
        <div class="modal-content">
            <h2>Notice</h2>
            <p>This page is a work in progress.</p>
            <button id="closeModalBtn">Close</button>
        </div>
    </div>

    <div style="text-align: right; margin-bottom: 20px;">
        <label for="darkModeToggle">
            <input type="checkbox" id="darkModeToggle"> <strong>Dark Mode</strong>
        </label>
    </div>

    <h1 id="welcomeMessage">Welcome to My Portfolio</h1>

    <nav>
        <ul>
            <li><a href="#about">About</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <main>
        <section id="about">
            <h2>About Me</h2>
            <p>Hello! I am Bachir, a student at ECPI University studying software engineering.</p>
            <h3>My Skills</h3>
            <ul id="skillsList"></ul>
        </section>

        <!-- Projects Section -->
        <section id="projects">
            <h2>My Projects</h2>
            <!-- Empty container for dynamically rendered projects -->
            <div id="projectContainer"></div>
        </section>

        <section id="contact">
            <h2>Contact Me</h2>
            <form id="contactForm" action="#" method="POST">
                <label for="senderName">Name:</label>
                <input type="text" id="senderName" name="senderName" required><br><br>

                <label for="address">Address / Email:</label>
                <input type="text" id="address" name="address" required><br><br>

                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="4" required></textarea><br><br>

                <button type="submit" id="submitBtn">Submit</button>
                <div id="formStatus"></div>
            </form>
        </section>
    </main>

    <script>
        // Scalable Foundations Objects, Arrays, sessionStorage, DOM Rendering      
        // Define array of JavaScript objects containing project data
        const projectDataArray = [
            {
                title: "Health and Fitness Web Application",
                summary: "A comprehensive health and fitness tracking web application utilizing HTML, CSS, and XAMPP Apache.",
                image: "https://via.placeholder.com/150?text=Health+&+Fitness",
                link: "https://github.com/bacnia1464/bacnia1464.github.io"
            },
            {
                title: "Web Design Blog",
                summary: "A personal blog project exploring front-end web design principles.",
                image: "https://via.placeholder.com/150?text=Web+Design+Blog",
                link: "https://github.com/bacnia1464/web-design-blog"
            }
        ];

        // Check sessionStorage and store/retrieve data
        if (!sessionStorage.getItem("portfolioProjects")) {
            // Convert array to string and store if it doesn't exist
            sessionStorage.setItem("portfolioProjects", JSON.stringify(projectDataArray));
        }
        
        // Retrieve and parse data from sessionStorage
        const storedProjects = JSON.parse(sessionStorage.getItem("portfolioProjects"));

        // Render projects dynamically
        const projectContainer = document.getElementById("projectContainer");

        storedProjects.forEach(project => {
            // Create DOM elements
            const cardDiv = document.createElement("div");
            cardDiv.className = "feature-box project-card";

            const projectTitle = document.createElement("h3");
            projectTitle.textContent = project.title;

            const projectSummary = document.createElement("p");
            projectSummary.textContent = project.summary;

            const projectLink = document.createElement("a");
            projectLink.href = project.link;
            projectLink.target = "_blank";

            const projectImage = document.createElement("img");
            projectImage.src = project.image;
            projectImage.alt = project.title;

            // Assemble the elements
            projectLink.appendChild(projectImage);
            cardDiv.appendChild(projectTitle);
            cardDiv.appendChild(projectSummary);
            cardDiv.appendChild(projectLink);

            // Append to the DOM container
            projectContainer.appendChild(cardDiv);
        });

        const modal = document.getElementById("welcomeModal");
        const closeBtn = document.getElementById("closeModalBtn");
        closeBtn.addEventListener("click", () => { modal.style.display = "none"; });

        const darkModeToggle = document.getElementById("darkModeToggle");
        if (localStorage.getItem("themePreference") === "dark") {
            document.body.classList.add("dark-mode");
            darkModeToggle.checked = true; 
        }

        darkModeToggle.addEventListener("change", function() {
            if (this.checked) {
                document.body.classList.add("dark-mode");
                localStorage.setItem("themePreference", "dark");
            } else {
                document.body.classList.remove("dark-mode");
                localStorage.setItem("themePreference", "light");
            }
        });

        const skillsArray = ["HTML", "CSS", "JavaScript", "Oracle SQL", "Git & GitHub"];
        const skillsList = document.getElementById("skillsList");
        skillsArray.forEach(function(skill) {
            let listItem = document.createElement("li");
            listItem.textContent = skill;
            skillsList.appendChild(listItem);
        });

        const notificationBar = document.createElement("div");
        notificationBar.className = "notification";
        notificationBar.textContent = "Welcome! My project data is now dynamically loaded from Session Storage.";
        const mainHeader = document.querySelector("#welcomeMessage");
        mainHeader.insertAdjacentElement("afterend", notificationBar);
        setTimeout(() => { notificationBar.style.display = "block"; }, 1500);

        const contactForm = document.getElementById("contactForm");
        const formStatus = document.getElementById("formStatus");
        contactForm.addEventListener("submit", function(event) {
            event.preventDefault(); 
            formStatus.style.color = "#0056b3";
            formStatus.textContent = "Sending message...";
            setTimeout(() => {
                formStatus.style.color = "green";
                formStatus.textContent = "Message sent successfully!";
                contactForm.reset();
            }, 2000);
        });
    </script>
</body>
</html>
