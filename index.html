<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bachir's Portfolio</title>
    <style>
        /* Base Styling */
        body {
            font-family: Arial, sans-serif;
            transition: background-color 0.3s, color 0.3s;
            padding: 20px;
        }
        
        .feature-box {
            border: 2px solid #0056b3;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            background-color: #f8f9fa;
        }

        /* Dark Mode Classes */
        body.dark-mode {
            background-color: #121212;
            color: #ffffff;
        }
        
        body.dark-mode .feature-box {
            background-color: #1e1e1e;
            border-color: #66b2ff;
        }
        
        body.dark-mode a {
            color: #66b2ff;
        }

        /* Dynamic Notification Styling */
        .notification {
            background-color: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none; /* Hidden by default until JavaScript shows it */
            text-align: center;
            font-weight: bold;
        }
        
        body.dark-mode .notification {
            background-color: #1a4d2e;
            color: #a3cfbb;
        }

        /* Form Status Message Styling */
        #formStatus {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Dark Mode Slider/Checkbox -->
    <div style="text-align: right; margin-bottom: 20px;">
        <label for="darkModeToggle">
            <input type="checkbox" id="darkModeToggle"> <strong>Dark Mode</strong>
        </label>
    </div>

    <h1 id="welcomeMessage">Welcome to My Portfolio</h1>

    <nav>
        <ul>
            <li><a href="#about">About</a></li>
            <li><a href="#featured-content">Featured Content</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <main>
        <!-- About Section -->
        <section id="about">
            <h2>About Me</h2>
            <p>Hello! I am Bachir, a student at ECPI University.</p>
            
            <h3>My Skills</h3>
            <ul id="skillsList"></ul>
        </section>

        <!-- Featured Content Section -->
        <section id="featured-content">
            <h2>Featured Content</h2>
            <div id="uniResources" class="feature-box">
                <h3>University Resources</h3>
                <a href="https://www.ecpi.edu" target="_blank">ECPI Program Home Page</a>
            </div>
            
            <div id="personalProjects" class="feature-box">
                <h3>Personal Projects</h3>
                <a href="https://github.com/bacnia1464/bacnia1464.github.io" target="_blank">
                    <img src="https://via.placeholder.com/150?text=Health+&+Fitness" alt="Health and Fitness Repo">
                </a>
            </div>
        </section>

        <!-- Projects Section -->
        <section id="projects">
            <h2>My Projects</h2>
            <a href="url?id=42/sdc260-midterm" class="project-link" target="_blank">
                <img src="https://via.placeholder.com/150?text=SDC260+Midterm" alt="SDC260 Midterm Project">
            </a>
            <a href="https://github.com/bacnia1464/web-design-blog" class="project-link" target="_blank">
                <img src="https://via.placeholder.com/150?text=Web+Design+Blog" alt="Web Design Blog">
            </a>
        </section>

        <!-- Contact Section -->
        <section id="contact">
            <h2>Contact Me</h2>
            <form id="contactForm" action="#" method="POST">
                <label for="senderName">Name:</label>
                <input type="text" id="senderName" name="senderName" required><br><br>

                <label for="address">Address / Email:</label>
                <input type="text" id="address" name="address" required><br><br>

                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="4" required></textarea><br><br>

                <button type="submit" id="submitBtn">Submit</button>
                
                <!-- Status container for form submissions -->
                <div id="formStatus"></div>
            </form>
        </section>
    </main>

    <script>

        // Variables, Loops, Conditionals Logic
        const skillsArray = ["HTML", "CSS", "JavaScript", "Oracle SQL", "Git & GitHub"];
        const skillsList = document.getElementById("skillsList");
        
        skillsArray.forEach(function(skill) {
            let listItem = document.createElement("li");
            listItem.textContent = skill;
            skillsList.appendChild(listItem);
        });

        const projectLinks = document.querySelectorAll(".project-link"); 
        const uniResourcesDiv = document.getElementById("uniResources");
        const personalProjectsDiv = document.getElementById("personalProjects");

        if (projectLinks.length < 3) {
            uniResourcesDiv.style.display = "block";
            personalProjectsDiv.style.display = "block";
        } else {
            uniResourcesDiv.style.display = "none";
            personalProjectsDiv.style.display = "block";
        }

        const darkModeToggle = document.getElementById("darkModeToggle");
        darkModeToggle.addEventListener("change", function() {
            document.body.classList.toggle("dark-mode");
        });


        // Dynamically Add a New Element
        // Create a notification bar element
        const notificationBar = document.createElement("div");
        notificationBar.className = "notification";
        notificationBar.textContent = "Welcome! Check out my newly added Health & Fitness Web App below.";
        
        // Append it just below the H1 element
        const mainHeader = document.querySelector("#welcomeMessage");
        mainHeader.insertAdjacentElement("afterend", notificationBar);
        
        // Use setTimeout to display the notification after a 1.5-second delay
        setTimeout(() => {
            notificationBar.style.display = "block";
        }, 1500);


        // Reference and Modify Existing Elements

        // Select the H1 element and add a bottom border
        const welcomeHeader = document.getElementById("welcomeMessage");
        welcomeHeader.style.borderBottom = "3px solid #0056b3";
        welcomeHeader.style.display = "inline-block";
        welcomeHeader.style.paddingBottom = "5px";

        // Select the About section and update its background color and padding
        const aboutSection = document.querySelector("#about");
        aboutSection.style.backgroundColor = "rgba(0, 86, 179, 0.05)"; // Light blue tint
        aboutSection.style.padding = "15px";
        aboutSection.style.borderRadius = "8px";
        aboutSection.style.border = "1px solid #ccc";


        // Timed Confirmation for Form Submission
        const contactForm = document.getElementById("contactForm");
        const formStatus = document.getElementById("formStatus");
        
        contactForm.addEventListener("submit", function(event) {
            // Prevent default page reload
            event.preventDefault(); 
            
            // Display a loading message
            formStatus.style.color = "#0056b3";
            formStatus.textContent = "Sending message...";
            
            // Use setTimeout to delay the confirmation message by 2 seconds
            setTimeout(() => {
                // Replace the loading message with the confirmation
                formStatus.style.color = "green";
                formStatus.textContent = "Message sent successfully!";
                
                // Clear the form fields after successful submission
                contactForm.reset();
            }, 2000);
        });
    </script>
</body>
</html>
